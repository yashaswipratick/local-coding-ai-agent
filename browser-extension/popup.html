<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local Coding AI Agent</title>
  <style>
    body { font: 14px system-ui, sans-serif; width: 320px; margin: 16px; }
    label { display: block; margin: 10px 0 4px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 7px; }
    button { margin-top: 12px; width: 100%; padding: 8px; }
    #status { margin-top: 10px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <strong>Local Coding AI Agent</strong>
  <label for="relay">Relay URL</label>
  <input id="relay" value="http://127.0.0.1:8787">
  <label for="token">Relay token</label>
  <input id="token" type="password" placeholder="Copy from relay startup output / token file">
  <button id="save">Save configuration</button>
  <button id="test">Test relay</button>
  <button id="start">Start Agent Mode in current ChatGPT tab</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
